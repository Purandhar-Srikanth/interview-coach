name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Tests use a fake LLM, so no API key (and no cost) is needed in CI.
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    # Builds the production image (the same one Render runs) and checks it starts and answers.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t interview-coach .
      - name: Start the container and call /api/health
        run: |
          docker run -d --name app -p 7860:7860 -e LLM_MODE=mock -e DEMO_MODE=true interview-coach
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:7860/ | grep -q "<title>Interview Coach</title>"
          docker logs app
