name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Tests use a fake LLM, so no API key (and no cost) is needed in CI.
      - run: pytest -q
      - name: Eval harness dry run (mock scores, checks the eval code still works)
        run: python ../evals/run_evals.py --mock
      - name: Known-vulnerability scan of Python packages
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Known-vulnerability scan of npm packages
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  e2e:
    # Drives the real app in a browser (Playwright): setup -> interview -> summary -> progress ->
    # history -> delete data, with the mock LLM.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    # Builds the production image (the same one Render runs) and checks it starts and answers.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t interview-coach .
      - name: Start the container and call /api/health
        run: |
          docker run -d --name app -p 7860:7860 -e LLM_MODE=mock -e DEMO_MODE=true interview-coach
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:7860/ | grep -q "<title>Interview Coach</title>"
          docker logs app
