name: Keep demo awake

# Render's free plan puts the server to sleep after 15 idle minutes, and waking it takes ~50 s.
# A shared link would then load slowly and link-preview crawlers (WhatsApp, LinkedIn...) give up
# before the page arrives, so the preview card is missing. A ping every 10 minutes keeps it
# awake: one service running all month (~744 h) fits in Render's 750 free hours.
# Note: GitHub pauses scheduled workflows after 60 days without commits; re-enable in the
# Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://interview-coach-tgse.onrender.com/api/health
