[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Third-party warning from langsmith (a langgraph dependency) on Python 3.14; not our code.
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]
